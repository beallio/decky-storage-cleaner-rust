[package]
name = "storage-cleaner-backend"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
decky-plugin = { version = "0.1.0", git = "https://github.com/beallio/decky-loader", rev = "192cedc66682a8319e039b05093a3b7e06f8824c" }
log = "0.4"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", features = ["macros", "rt"] }

# Local SDK work: build against a sibling decky-loader checkout instead of the pinned rev.
# [patch."https://github.com/beallio/decky-loader"]
# decky-plugin = { path = "../../decky-loader/backend-rust/decky-plugin" }

[profile.release]
strip = true
lto = true
codegen-units = 1
