name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pinned pnpm and Rust
        run: |
          npm install --global "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          rustup toolchain install # reads rust-toolchain.toml, including the musl target
      - run: scripts/quality-gates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decky-storage-cleaner-rust
          path: out/decky-storage-cleaner-rust.zip
